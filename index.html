<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diels–Alder Reaction — Cyclopentadiene + Maleic Anhydride</title>
  <meta name="description" content="An interactive, fact-checked walkthrough of the Diels–Alder [4+2] cycloaddition of cyclopentadiene with maleic anhydride: real 3D structures, the concerted mechanism and endo rule, the microscale procedure, and a live yield calculator." />
  <link rel="icon" href="https://orgolabs.github.io/shared/brand/orgolabs-icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="stylesheet" href="https://orgolabs.github.io/shared/styles.css" />
</head>
<body>
  <noscript><p style="padding:24px">This interactive lab needs JavaScript. Source: <a href="https://github.com/orgolabs/diels-alder">github.com/orgolabs/diels-alder</a></p></noscript>

  <script>
    window.LAB = {
      repo: "diels-alder",
      labName: "Diels–Alder Reaction",
      eyebrow: "Interactive organic chemistry · pericyclic [4+2] cycloaddition",
      title: "The Diels–Alder Reaction",
      lede: "A <strong>conjugated diene</strong> and an electron-poor <strong>dienophile</strong> snap together in one concerted step, forming a six-membered ring and <strong>two new carbon–carbon bonds</strong> at once. Here cyclopentadiene meets maleic anhydride to give the bicyclic <strong>endo</strong> adduct. Rotate the real molecules, follow the mechanism, and scale the microscale experiment below.",
      reaction: "\\ce{C5H6 + C4H2O3 -> C9H8O3}",
      content: "content.md",
      viewers: [
        { id: "view-cyclopentadiene", key: "cyclopentadiene", kind: "start", role: "Diene", name: "Cyclopentadiene",
          iupac: "cyclopenta-1,3-diene", note: "Locked in the reactive <em>s-cis</em> shape — its two C=C sit coplanar and adjacent, ready for a [4+2]." },
        { id: "view-maleic_anhydride", key: "maleic_anhydride", kind: "start", role: "Dienophile", name: "Maleic anhydride",
          iupac: "furan-2,5-dione", note: "Two electron-withdrawing carbonyls lower the alkene’s LUMO, making it a fast dienophile." },
        { id: "view-endo_adduct", key: "endo_adduct", kind: "major", role: "Product (endo)", name: "endo-Norbornene anhydride",
          iupac: "(1S,2R,6S,7R)-4-oxatricyclo[5.2.1.0²,⁶]dec-8-ene-3,5-dione", note: "<b>endo adduct.</b> A new six-membered ring plus two new C–C bonds; carbonyls tucked under the ring (endo)." }
      ],
      pathway: [
        { node: { img: "cyclopentadiene.png", name: "Cyclopentadiene", sub: "$\\ce{C5H6}$ · diene" } },
        { plus: true },
        { node: { img: "maleic-anhydride.png", name: "Maleic anhydride", sub: "$\\ce{C4H2O3}$ · dienophile" } },
        { op: { cond: "\\ce{EtOAc}", sub: "0 °C · [4+2]" } },
        { node: { img: "endo-adduct.png", name: "endo adduct", sub: "$\\ce{C9H8O3}$ · + exo (minor)", kind: "major" } }
      ],
      pathwayCaption: "A concerted [4+2] cycloaddition: the s-cis diene and the electron-poor dienophile form two new C–C bonds in a single cyclic transition state, giving mainly the endo adduct.",
      calculator: {
        intro: "Pre-filled with the handout’s microscale amounts (0.20 g maleic anhydride, 0.2 mL cyclopentadiene). Molar masses: maleic anhydride 98.06, cyclopentadiene 66.10, adduct 164.16 g/mol; cyclopentadiene density ≈0.80 g/mL. The adduct forms 1 : 1 from the limiting reagent.",
        inputs: [
          { id: "in-ma", label: "Maleic anhydride mass (g)", value: "0.20", step: "0.01" },
          { id: "in-cp", label: "Cyclopentadiene volume (mL)", value: "0.2", step: "0.05", note: "density ≈0.80 g/mL" },
          { id: "in-isolated", label: "Isolated adduct mass (g)", value: "0.25", step: "0.01", optional: true }
        ],
        outputs: [
          { id: "o-mammol", label: "Maleic anhydride", unit: "mmol" },
          { id: "o-cpmmol", label: "Cyclopentadiene", unit: "mmol" },
          { id: "o-limiting", label: "Limiting reagent", unit: "" },
          { id: "o-theory", label: "Theoretical adduct", unit: "g", kind: "major" },
          { id: "o-yield", label: "Percent yield", unit: "%", kind: "yield" }
        ],
        compute: function (v) {
          var MA = 98.06, CP = 66.10, P = 164.16, d = 0.80;
          if (!(v["in-ma"] > 0)) return {};
          var mm = v["in-ma"] / MA * 1000, cm = v["in-cp"] * d / CP * 1000, lim = Math.min(mm, cm), theory = lim / 1000 * P;
          var o = {
            "o-mammol": mm.toFixed(2),
            "o-cpmmol": cm.toFixed(2),
            "o-limiting": mm <= cm ? "maleic anhydride" : "cyclopentadiene",
            "o-theory": theory.toFixed(3)
          };
          o["o-yield"] = v["in-isolated"] > 0 ? (v["in-isolated"] / theory * 100).toFixed(1) : "";
          return o;
        }
      },
      references: [
        { authors: "Williamson, K. L.; Masters, K. M.", title: "The Diels–Alder Reaction of Cyclopentadiene with Maleic Anhydride", meta: "Macroscale and Microscale Organic Experiments, 7th ed.; Cengage, 2016; Ch. 48, p 626.", note: "The source experiment (bundled here).", url: "docs/diels-alder-lab-manual.pdf", linkText: "Download the lab manual (PDF)", access: "open" },
        { authors: "Diels, O.; Alder, K.", title: "Synthesen in der hydroaromatischen Reihe", meta: "Justus Liebigs Ann. Chem. 1928, 460, 98–122.", note: "The original report of the diene synthesis (the Diels–Alder reaction); shared the 1950 Nobel Prize in Chemistry.", url: "https://doi.org/10.1002/jlac.19284600106", linkText: "doi.org/10.1002/jlac.19284600106", access: "paywall" },
        { authors: "PubChem, U.S. National Library of Medicine.", title: "Cyclopentadiene (7612), Maleic anhydride (7923), endo-Norbornene-2,3-dicarboxylic anhydride (2723766)", meta: "Public-domain compound records and computed 3D conformers.", note: "Free and public. The 3D coordinates come directly from these records via PUG-REST.", url: "https://pubchem.ncbi.nlm.nih.gov/compound/2723766", linkText: "pubchem.ncbi.nlm.nih.gov/compound/2723766", access: "open" },
        { authors: "Rego, N.; Koes, D.", title: "3Dmol.js: molecular visualization with WebGL", meta: "Bioinformatics 2015, 31 (8), 1322–1324.", note: "The open-source (BSD-3) library rendering the interactive structures.", url: "https://doi.org/10.1093/bioinformatics/btu829", linkText: "doi.org/10.1093/bioinformatics/btu829", access: "open" }
      ]
    };
  </script>
  <script src="js/structures.js"></script>
  <script type="module" src="https://orgolabs.github.io/shared/lab.js"></script>
</body>
</html>
